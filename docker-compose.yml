services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl          # local demo credentials only
      POSTGRES_DB: warehouse
    ports: ["5432:5432"]
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d warehouse"]
      interval: 5s
      retries: 10

  airflow:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://etl:etl@postgres/airflow
      PYTHONPATH: /opt/airflow
      WAREHOUSE_HOST: postgres
      WAREHOUSE_DB: warehouse
      WAREHOUSE_USER: etl
      WAREHOUSE_PASSWORD: etl
      DATA_DIR: /opt/airflow/data
      N_ORDERS: ${N_ORDERS:-1000000}       # set to 10000000 for the full-size run
      N_CUSTOMERS: ${N_CUSTOMERS:-100000}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}   # optional Slack-compatible webhook
    ports: ["8080:8080"]
    volumes:
      - ./dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./tests:/opt/airflow/tests
      - ./data:/opt/airflow/data
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username admin --password admin --firstname Admin
      --lastname User --role Admin --email admin@example.com || true) &&
      (airflow scheduler &) && exec airflow webserver"

volumes:
  pgdata:
